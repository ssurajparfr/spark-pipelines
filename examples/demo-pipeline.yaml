apiVersion: data.mycompany.io/v1alpha1
kind: SparkSqlPipeline
metadata:
  name: demo-pipeline
  namespace: dev
spec:
  image: spark-s3a:4.0.1
  imagePullPolicy: IfNotPresent
  sparkVersion: "4.0.1"
  minio:
    endpoint: "http://minio.minio.svc.cluster.local:9000"
    credentialsSecret: "minio-credentials"
    appConfigMap: "app-config"
    scriptsBucket: "spark-jars"
  driver:
    cores: 1
    memory: "512m"
    serviceAccount: team-a-spark
  executor:
    cores: 1
    instances: 1
    memory: "512m"
  steps:
    - id: step1
      input: "s3a://job-data/dev/data.csv"
      output: "s3a://job-data/dev-output/processed/"
      partitionColumn: "batch_date"   # optional daily partition
      sql: "s3a://spark-jars/transform.sql"

    - id: step2
      script: "step2_process.py"
      arguments:
        - "s3a://job-data/dev-output/processed/"  # input can be automatically adjusted to include partition path
        - "s3a://job-data/dev-output/summary/"
      partitionColumn: "batch_date"   # optional, for partition-aware reads/writes
      dependsOn:
        - step1